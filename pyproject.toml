[project]
name = "ram-lite"
version = "0.6.0"
description = "Personal Roblox account manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8.0,<6.9.0",
    "requests>=2.32.0",
    "psutil>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
